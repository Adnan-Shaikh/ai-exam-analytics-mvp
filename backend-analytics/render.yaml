services:
  - type: web
    name: exam-analytics-api
    env: python
    region: oregon
    plan: free
    branch: main
    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn app.main:app --host 0.0.0.0 --port $PORT
    envVars:
      - key: DATABASE_URL
        value: sqlite:///./exam_analytics.db
      - key: ENVIRONMENT
        value: production
      - key: CORS_ORIGINS
        value: https://exam-analytics.vercel.app,http://localhost:5173